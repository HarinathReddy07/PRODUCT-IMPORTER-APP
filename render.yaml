services:
  - type: web
    name: product-importer-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn api:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: FASTAPI_HOST
        value: 0.0.0.0
      - key: FASTAPI_PORT
        value: 8000

  - type: worker
    name: product-importer-worker
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A celery_app.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
